[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=console,file

[formatters]
keys=standard,access

[logger_root]
level=INFO
handlers=console,file

[logger_uvicorn]
level=INFO
handlers=console,file
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=console,file
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=console,file
propagate=0
qualname=uvicorn.access

[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_file]
class=logging.handlers.TimedRotatingFileHandler
level=INFO
formatter=standard
args=('/var/log/qradarapp/app.log', 'midnight', 7, 10)

[formatter_standard]
format=%(asctime)s [%(levelname)s] %(name)s - %(message)s

[formatter_access]
format=%(asctime)s [ACCESS] %(client_addr)s - "%(request_line)s" %(status_code)s

