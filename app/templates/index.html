<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>QRadar Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/static/logo-asper.png" alt="ASPER">
        <div class="title">
          <h1>Monitoramento & Execução</h1>
          <div class="sub">QRadar • Zabbix • SSH</div>
        </div>
      </div>
      <div class="row">
        <span class="small">Logado como {{user}}</span>
        <a class="btn secondary" href="/me/password">Minha conta</a>
        {% if is_admin %}
        <a class="btn secondary" href="/admin/users">Admin</a>
        {% endif %}
        <a class="btn secondary" href="/logout">Sair</a>
      </div>
    </header>

    <div class="tabs-mode">
      <div class="tab active" data-mode="monitor">Monitoramento</div>
      <div class="tab" data-mode="scripts">Execução de Scripts</div>
    </div>

    <section id="mode-monitor" class="card">
      <div class="row">
        <button class="btn secondary" id="refresh">Atualizar</button>
        <span class="small" id="last-ts"></span>
      </div>
      <div class="hr"></div>
      <div class="row small"><span class="badge b-ok">CPU/Mem/Store via Zabbix</span><span class="badge b-warn">Licença via license.sh</span></div>
      <div class="accordion" id="env-accordion"></div>
    </section>

<script>
const tabs = Array.from(document.querySelectorAll('.tab'));
tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('mode-monitor').style.display = t.dataset.mode==='monitor' ? 'block':'none';
});

const DAY_MS = 24 * 60 * 60 * 1000;

function parseNumberValue(raw) {
  if (raw === null || raw === undefined) return null;
  const trimmed = String(raw).trim();
  if (!trimmed) return null;

  const tokenMatches = trimmed.replace(/\u00A0/g, ' ').match(/[-+]?\d[\d.,\s]*/g);
  if (!tokenMatches) return null;

  for (const token of tokenMatches) {
    let sanitized = token
      .replace(/\s+/g, '')
      .replace(/[^0-9,.+-]/g, '');
    if (!sanitized || /^[-+]+$/.test(sanitized)) continue;

    const isNegative = sanitized.startsWith('-');
    const isPositive = sanitized.startsWith('+');
    if (isNegative || isPositive) {
      sanitized = sanitized.slice(1);
    }

    const hasComma = sanitized.includes(',');
    const hasDot = sanitized.includes('.');

    if (hasComma && hasDot) {
      if (sanitized.lastIndexOf('.') > sanitized.lastIndexOf(',')) {
        sanitized = sanitized.replace(/,/g, '');
      } else {
        sanitized = sanitized.replace(/\./g, '').replace(',', '.');
      }
    } else if (hasComma) {
      const thousandsCommaPattern = /^\d{1,3}(,\d{3})+$/;
      if (thousandsCommaPattern.test(sanitized)) {
        sanitized = sanitized.replace(/,/g, '');
      } else {
        sanitized = sanitized.replace(/,/g, '.');
      }
    } else if (hasDot) {
      const thousandsDotPattern = /^\d{1,3}(\.\d{3})+$/;
      if (thousandsDotPattern.test(sanitized)) {
        sanitized = sanitized.replace(/\./g, '');
      }
    }

    const numeric = Number(sanitized);
    if (Number.isFinite(numeric)) {
      return isNegative ? -numeric : numeric;
    }
  }

  return null;
}

function parseDateValue(raw) {
  if (typeof raw !== 'string') return null;
  const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) {
    const [, dd, mm, yyyy] = m;
    const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
    return Number.isNaN(date.getTime()) ? null : date;
  }
  const parsed = new Date(raw);
  return Number.isNaN(parsed.getTime()) ? null : parsed;
}

function getExpirationClass(expirations) {
  if (!expirations.length) return '';
  const now = new Date();
  const soonest = expirations.reduce((min, current) => (current < min ? current : min));
  const diffDays = (soonest - now) / DAY_MS;
  if (diffDays < 15) return 'cell-danger';
  if (diffDays < 30) return 'cell-warn';
  return '';
}

function formatApplianceMetrics(appliance) {
  const metrics = [
    `CPU ${appliance.cpu ?? '—'}`,
    `Mem ${appliance.memory ?? '—'}`,
    `Storage ${appliance.storage ?? '—'}`,
  ];
  return metrics.join(' | ');
}

async function loadMonitor(){
  const r = await fetch('/api/monitor');
  if(!r.ok) return;
  const j = await r.json();
  const rows = j.rows || [];
  const accordion = document.getElementById('env-accordion');
  accordion.innerHTML = rows.map(d=>{
    const expList = Array.isArray(d.license_exp_list) ? d.license_exp_list.filter(Boolean) : [];
    const breakdown = Array.isArray(d.license_breakdown) ? d.license_breakdown : [];
    const expDisplay = expList.length ? expList.join(' • ') : (d.license_exp ?? '—');
    const tooltipLines = breakdown.map(p=>{
      const kind = p.kind ?? '—';
      const limit = p.limit ?? '—';
      const exp = p.expires ? ' (exp: ' + p.expires + ')' : '';
      return `${kind}: ${limit}${exp}`;
    });
    const showTooltip = breakdown.length > 1 || expList.length > 1;
    const expCell = showTooltip
      ? `<span title="${tooltipLines.join('\n')}">${expDisplay}</span>`
      : expDisplay;
    const epsCurrentVal = parseNumberValue(d.eps_current);
    const licenseEpsVal = parseNumberValue(d.license_eps);
    const warnEps = epsCurrentVal !== null && licenseEpsVal !== null && epsCurrentVal > licenseEpsVal;
    const expirationCandidates = expList.length ? expList : (d.license_exp ? [d.license_exp] : []);
    const expirationDates = expirationCandidates
      .map(parseDateValue)
      .filter(dt => dt instanceof Date && !Number.isNaN(dt.getTime()));
    const expirationClass = getExpirationClass(expirationDates);
    let iconHtml = '';
    if (expirationClass === 'cell-danger') {
      iconHtml = '<span class="danger-icon" title="Licença expira em menos de 15 dias">⛔</span>';
    } else if (warnEps) {
      iconHtml = '<span class="warning-icon" title="EPS atual acima da licença">⚠️</span>';
    } else if (expirationClass === 'cell-warn') {
      iconHtml = '<span class="warning-icon" title="Licença expira em menos de 30 dias">⚠️</span>';
    }
    const summaryPieces = [
      `CPU: ${d.cpu ?? '—'}`,
      `Mem: ${d.memory ?? '—'}`,
      `Storage: ${d.storage ?? '—'}`,
      `EPS Atual: ${d.eps_current ?? '—'}`,
      `EPS Máx: ${d.eps_max ?? '—'}`,
      `Licença EPS: ${d.license_eps ?? '—'}`,
      `Expiração: ${expCell}`
    ];
    const appliances = Array.isArray(d.appliances) ? d.appliances : [];
    const applianceList = appliances.length
      ? `<ul class="appliance-tree">${appliances.map((appliance, idx) => {
          const isLast = idx === appliances.length - 1;
          return `<li class="${isLast ? 'last' : ''}">
            <span class="appliance-name">${appliance.name ?? '—'}</span>
            <span class="appliance-metrics">${formatApplianceMetrics(appliance)}</span>
          </li>`;
        }).join('')}</ul>`
      : '<div class="empty-appliances">Nenhum appliance adicional configurado.</div>';
    const epsDangerClass = warnEps ? 'text-danger' : '';
    const expirationClassText = expirationClass === 'cell-danger' ? 'text-danger' : expirationClass === 'cell-warn' ? 'text-warn' : '';
    return `<div class="accordion-item">
      <button class="accordion-header" type="button">
        <span class="chevron" aria-hidden="true">▶</span>
        <div class="accordion-main">
          <div class="accordion-title">${d.name ?? '—'}</div>
          <div class="accordion-summary ${epsDangerClass} ${expirationClassText}">${summaryPieces.join(' | ')}</div>
        </div>
        <div class="accordion-status">[Expandir detalhes]</div>
        <div class="accordion-icon">${iconHtml}</div>
      </button>
      <div class="accordion-panel">
        ${applianceList}
      </div>
    </div>`;
  }).join('');
  Array.from(document.querySelectorAll('.accordion-header')).forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.accordion-item');
      const status = btn.querySelector('.accordion-status');
      const chevron = btn.querySelector('.chevron');
      const isOpen = item.classList.toggle('open');
      if (status) status.textContent = isOpen ? '[Recolher detalhes]' : '[Expandir detalhes]';
      if (chevron) chevron.textContent = isOpen ? '▼' : '▶';
    });
  });
  document.getElementById('last-ts').textContent = 'Atualizado: '+(j.updated_at||new Date().toLocaleString());
}

document.getElementById('refresh').onclick = loadMonitor;
loadMonitor();
setInterval(loadMonitor, 30000);
</script>
</body>
</html>
