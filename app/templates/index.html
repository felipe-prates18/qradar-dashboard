<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRadar Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/static/logo-asper.png" alt="ASPER">
        <div class="title">
          <div class="title-row">
            <h1 id="dashboard-title">Monitoramento</h1>
            <div class="module-tabs" id="module-tabs" role="tablist" aria-label="Seções do dashboard">
              <button type="button" class="tab-button is-active" data-tab="monitor" role="tab" aria-selected="true">Monitoramento</button>
              <button type="button" class="tab-button" data-tab="health" role="tab" aria-selected="false">Health Check</button>
              <button type="button" class="tab-button" data-tab="jira" role="tab" aria-selected="false">Jira</button>
              {% if can_access_reports %}
              <button type="button" class="tab-button" data-tab="reports" role="tab" aria-selected="false">Reports</button>
              {% endif %}
            </div>
          </div>
          <div class="sub" id="dashboard-subtitle">Carregando status do monitoramento…</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="user-label small">Logado como {{user}}</span>
        <div class="header-buttons">
          <a class="btn secondary" href="/me/password">Minha conta</a>
          {% if can_access_threat_hunting %}
          <a class="btn secondary" href="/threat-hunting">Hunting Wiki</a>
          {% endif %}
          {% if is_admin %}
          <a class="btn secondary" href="/admin/users">Admin</a>
          {% endif %}
          {% if can_access_reports %}
          <a class="btn secondary" href="/reports">Reports</a>
          {% endif %}
          <a class="btn secondary" href="/logout">Sair</a>
        </div>
      </div>
    </header>

    <section class="card">
      <div id="monitor-app-root"></div>
    </section>
  </div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    {% raw %}
    const { useState, useEffect, useCallback, useRef } = React;

    const DAY_MS = 24 * 60 * 60 * 1000;
    const STATUS_ICON = {
      normal: '🟢',
      warning: '🟡',
      critical: '🔴'
    };

    function normalizeStatus(value) {
      const v = (value || '').toString().toLowerCase();
      if (v === 'critical' || v === 'error') return 'critical';
      if (v === 'warning') return 'warning';
      return 'normal';
    }

    function RefreshIcon({ className = '' }) {
      const classes = ['refresh-icon', className].filter(Boolean).join(' ');
      return (
        <svg
          className={classes}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
        >
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path d="M3.51 9a9 9 0 0114.13-3.36L23 10" />
          <path d="M20.49 15a9 9 0 01-14.13 3.36L1 14" />
        </svg>
      );
    }

    function parseNumberValue(raw) {
      if (raw === null || raw === undefined) return null;
      const trimmed = String(raw).trim();
      if (!trimmed) return null;

      const tokenMatches = trimmed.replace(/\u00A0/g, ' ').match(/[-+]?\d[\d.,\s]*/g);
      if (!tokenMatches) return null;

      for (const token of tokenMatches) {
        let sanitized = token
          .replace(/\s+/g, '')
          .replace(/[^0-9,.+-]/g, '');
        if (!sanitized || /^[-+]+$/.test(sanitized)) continue;

        const isNegative = sanitized.startsWith('-');
        const isPositive = sanitized.startsWith('+');
        if (isNegative || isPositive) {
          sanitized = sanitized.slice(1);
        }

        const hasComma = sanitized.includes(',');
        const hasDot = sanitized.includes('.');

        if (hasComma && hasDot) {
          if (sanitized.lastIndexOf('.') > sanitized.lastIndexOf(',')) {
            sanitized = sanitized.replace(/,/g, '');
          } else {
            sanitized = sanitized.replace(/\./g, '').replace(',', '.');
          }
        } else if (hasComma) {
          const thousandsCommaPattern = /^\d{1,3}(,\d{3})+$/;
          if (thousandsCommaPattern.test(sanitized)) {
            sanitized = sanitized.replace(/,/g, '');
          } else {
            sanitized = sanitized.replace(/,/g, '.');
          }
        } else if (hasDot) {
          const thousandsDotPattern = /^\d{1,3}(\.\d{3})+$/;
          if (thousandsDotPattern.test(sanitized)) {
            sanitized = sanitized.replace(/\./g, '');
          }
        }

        const numeric = Number(sanitized);
        if (Number.isFinite(numeric)) {
          return isNegative ? -numeric : numeric;
        }
      }

      return null;
    }

    function parseDateValue(raw) {
      if (typeof raw !== 'string') return null;
      const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) {
        const [, dd, mm, yyyy] = m;
        const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
        return Number.isNaN(date.getTime()) ? null : date;
      }
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDateInputLabel(value) {
      if (!value) return '—';
      const parsed = parseDateValue(value);
      if (!parsed) return value;
      return parsed.toLocaleDateString('pt-BR');
    }

    function formatExpirationDisplay(raw) {
      if (raw === null || raw === undefined) return null;
      const trimmed = String(raw).trim();
      if (!trimmed) return null;
      if (trimmed === '01/01/9999' || trimmed.startsWith('01/01/9999 ')) return 'PERPETUAL';
      return trimmed;
    }

    function formatDateTimeDisplay(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function formatHoursDisplay(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return '—';
      const rounded = Math.round(Number(value) * 10) / 10;
      return `${rounded.toFixed(1)}h`;
    }

    function getUsageStatus({ cpu, memory, storage }) {
      const values = [cpu, memory, storage]
        .map(parseNumberValue)
        .filter(v => typeof v === 'number');
      if (!values.length) return 'normal';
      const max = Math.max(...values);
      if (max >= 85) return 'critical';
      if (max >= 70) return 'warning';
      return 'normal';
    }

    function getExpirationStatus(expirations) {
      if (!expirations.length) return 'normal';
      const now = new Date();
      const soonest = expirations.reduce((min, current) => (current < min ? current : min));
      const diffDays = (soonest - now) / DAY_MS;
      if (diffDays < 15) return 'critical';
      if (diffDays < 30) return 'warning';
      return 'normal';
    }

    function formatCompact(value) {
      const numeric = parseNumberValue(value);
      if (numeric === null) return '—';
      if (numeric >= 1000000) return (numeric / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (numeric >= 1000) return Math.round(numeric / 100) / 10 + 'k';
      return String(numeric);
    }

    function formatGigabytes(value) {
      const numeric = parseNumberValue(value);
      if (numeric === null) return '—';
      const formatted = numeric >= 10 ? numeric.toFixed(1) : numeric.toFixed(2);
      return `${formatted} GB`;
    }

    function formatConnectorVolume(connector) {
      if (!connector) return '—';
      const bytes = connector.last_ingested_volume_bytes;
      if (typeof bytes === 'number' && Number.isFinite(bytes)) {
        return formatGigabytes(bytes / 1_000_000_000);
      }
      const raw = connector.last_ingested_volume_one_day;
      if (raw === null || raw === undefined || raw === '') return '—';
      const numeric = parseNumberValue(raw);
      if (numeric !== null) return formatGigabytes(numeric);
      return String(raw);
    }

    function getConnectorSeverity(connector) {
      if (!connector) return 'warning';
      const statusText = connector.status ? String(connector.status).trim().toLowerCase() : '';
      if (!statusText) return 'warning';
      if (statusText === 'active') return 'normal';
      if (statusText === 'pending' || statusText === 'paused') return 'warning';
      if (statusText === 'idle') return 'critical';
      if (
        statusText.includes('error') ||
        statusText.includes('fail') ||
        statusText.includes('inactive') ||
        statusText.includes('disabled')
      ) {
        return 'critical';
      }
      if (statusText.includes('warning') || statusText.includes('degraded') || statusText.includes('stale')) {
        return 'warning';
      }
      return 'normal';
    }

    function connectorTypeLabel(connector) {
      if (!connector) return '';
      return (
        connector.type ||
        connector.product ||
        connector.vendor ||
        ''
      );
    }

    const STATUS_RANK = { normal: 0, warning: 1, critical: 2 };
    const STATUS_LABEL = {
      normal: 'OK',
      warning: 'At Risk',
      critical: 'Overload'
    };

    function clampPercent(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return null;
      return Math.max(0, Math.min(100, value));
    }

    function getSeverityByPercent(percent) {
      if (percent === null || Number.isNaN(percent)) return 'neutral';
      if (percent >= 90) return 'critical';
      if (percent >= 75) return 'warning';
      return 'normal';
    }

    function getEpsStatus(epsValue, licenseValue, percentValue) {
      if (
        epsValue === null ||
        epsValue === undefined ||
        licenseValue === null ||
        licenseValue === undefined ||
        Number.isNaN(epsValue) ||
        Number.isNaN(licenseValue) ||
        licenseValue <= 0
      ) {
        return getSeverityByPercent(percentValue ?? null);
      }

      const overage = epsValue - licenseValue;
      if (overage > 100) {
        return 'critical';
      }
      if (overage > 0) {
        return 'warning';
      }

      const baseStatus = getSeverityByPercent(percentValue ?? null);
      return baseStatus === 'critical' ? 'warning' : baseStatus;
    }

    function combineStatuses(statuses) {
      return statuses.reduce((worst, current) => {
        if (!current) return worst;
        if (!(current in STATUS_RANK)) return worst;
        return STATUS_RANK[current] > STATUS_RANK[worst] ? current : worst;
      }, 'normal');
    }

    function isCrowdstrikeEnvironment(environment) {
      if (!environment || typeof environment !== 'object') return false;
      const siemValue = environment.siem ? String(environment.siem) : '';
      return siemValue.trim().toLowerCase() === 'crowdstrike ng-siem';
    }

    function getCrowdstrikeOverallStatus(environment) {
      if (!environment || typeof environment !== 'object') return 'warning';
      const hasErrors =
        (Array.isArray(environment.errors) && environment.errors.filter(Boolean).length > 0) ||
        Boolean(environment.error);

      if (hasErrors) return 'critical';

      const connectorsCount = parseNumberValue(
        environment.connectors_count ??
          environment.connectors_total ??
          (environment.ingestion && environment.ingestion.connectors_count) ??
          (Array.isArray(environment.connectors) ? environment.connectors.length : null)
      );
      const totalGbDecimal = parseNumberValue(
        environment.total_gb_one_day_decimal ??
          (environment.ingestion && environment.ingestion.total_gb_one_day_decimal)
      );
      const totalGibBinary = parseNumberValue(
        environment.total_gib_one_day_binary ??
          (environment.ingestion && environment.ingestion.total_gib_one_day_binary)
      );
      const totalIngested = totalGbDecimal ?? totalGibBinary;

      if (connectorsCount === 0) return 'warning';
      if (totalIngested !== null && totalIngested <= 0) return 'warning';
      return 'normal';
    }

    function getEnvironmentOverallStatus(environment) {
      if (!environment || typeof environment !== 'object') {
        return 'normal';
      }

      if (isCrowdstrikeEnvironment(environment)) {
        return getCrowdstrikeOverallStatus(environment);
      }

      const licenseExpRawList = Array.isArray(environment.license_exp_list)
        ? environment.license_exp_list.filter(Boolean)
        : [];
      const expirationCandidatesRaw = licenseExpRawList.length
        ? licenseExpRawList
        : environment.license_exp
        ? [environment.license_exp]
        : [];
      const expirationDates = expirationCandidatesRaw
        .map(parseDateValue)
        .filter(date => date instanceof Date && !Number.isNaN(date.getTime()));
      const expirationStatus = getExpirationStatus(expirationDates);

      const epsCurrent = parseNumberValue(environment.eps_current);
      const epsMax = parseNumberValue(environment.eps_max);
      const licenseEps = parseNumberValue(environment.license_eps);
      const epsPercent =
        licenseEps !== null && licenseEps > 0 && epsCurrent !== null
          ? (epsCurrent / licenseEps) * 100
          : null;
      const epsMaxPercent =
        licenseEps !== null && licenseEps > 0 && epsMax !== null
          ? (epsMax / licenseEps) * 100
          : null;
      const epsStatus = getEpsStatus(epsCurrent, licenseEps, epsPercent ?? null);
      const epsMaxStatus = getEpsStatus(epsMax, licenseEps, epsMaxPercent ?? null);

      const usageStatus = getUsageStatus({
        cpu: environment.cpu,
        memory: environment.memory,
        storage: environment.storage,
      });

      const licenseStatuses = [epsStatus, epsMaxStatus, expirationStatus];
      let overallStatus = combineStatuses([usageStatus, ...licenseStatuses]);

      const hasLicenseOrExpiryIssue = licenseStatuses.some(
        status => status === 'warning' || status === 'critical'
      );
      const consoleStoragePercent = parseNumberValue(environment.storage);
      if (!hasLicenseOrExpiryIssue && usageStatus !== 'normal') {
        overallStatus =
          consoleStoragePercent !== null && consoleStoragePercent >= 88
            ? 'critical'
            : 'warning';
      }

      return overallStatus;
    }

    const SIMPLE_CHECK_STATUS_LABELS = {
      ok: 'OK',
      success: 'OK',
      warning: 'Atenção',
      error: 'Erro',
      critical: 'Erro',
      failed: 'Erro',
      empty: 'Sem registros',
      missing: 'Indisponível',
    };

    function getSimpleCheckSeverity(check) {
      if (!check) return 'warning';
      const statusKey = (check.status ? String(check.status) : '').toLowerCase();
      if (statusKey === 'ok' || statusKey === 'success') return 'normal';
      if (statusKey === 'warning') return 'warning';
      if (statusKey === 'error' || statusKey === 'critical' || statusKey === 'failed') return 'critical';
      if (statusKey === 'empty' || statusKey === 'missing') return 'critical';
      if (check.error) return 'critical';
      return 'warning';
    }

    function getSimpleCheckStatusLabel(check) {
      if (!check) return 'Indefinido';
      const statusKey = (check.status ? String(check.status) : '').toLowerCase();
      if (SIMPLE_CHECK_STATUS_LABELS[statusKey]) {
        return SIMPLE_CHECK_STATUS_LABELS[statusKey];
      }
      if (check.error) return 'Erro';
      return check.status ? String(check.status) : 'Indefinido';
    }

    const SERVICE_STATUS_LABELS = {
      active: 'Ativo',
      inactive: 'Inativo',
      failed: 'Falhou',
      activating: 'Ativando',
      deactivating: 'Desativando',
      reloading: 'Recarregando',
      maintenance: 'Manutenção',
      unknown: 'Desconhecido',
      error: 'Erro',
    };

    const SERVICE_SUBSTATE_LABELS = {
      running: 'Em execução',
      exited: 'Finalizado',
      dead: 'Parado',
      listening: 'Ouvindo',
      auto_restart: 'Auto reiniciando',
      reload: 'Recarregando',
    };

    const ENABLED_STATUS_LABELS = {
      enabled: 'Habilitado',
      disabled: 'Desabilitado',
      static: 'Estático',
      masked: 'Mascarado',
      indirect: 'Indireto',
      transient: 'Transitório',
      generated: 'Gerado',
      bad: 'Inválido',
      unknown: 'Desconhecido',
    };

    const DEFAULT_HEALTH_SETTINGS = {
      latency_warning_ms: 150,
      latency_critical_ms: 300,
      packet_loss_warning: 5,
    };

    function getServiceSeverity(service) {
      const status = (service && service.status ? String(service.status) : '').toLowerCase();
      if (!status) return service && service.error ? 'critical' : 'warning';
      if (status === 'error') return 'critical';
      if (status === 'active') return 'normal';
      if (status === 'reloading' || status === 'activating') return 'warning';
      if (status === 'deactivating') return 'warning';
      if (status === 'unknown') return service && service.error ? 'critical' : 'warning';
      return 'critical';
    }

    function getServiceStatusLabel(service) {
      const statusKey = (service && service.status ? String(service.status) : '').toLowerCase();
      const baseLabel = SERVICE_STATUS_LABELS[statusKey] || (service && service.status ? service.status : 'Desconhecido');
      const subKey = (service && service.sub_state ? String(service.sub_state) : '').toLowerCase();
      if (!subKey) return baseLabel;
      const subLabel = SERVICE_SUBSTATE_LABELS[subKey] || (service ? service.sub_state : '');
      if (!subLabel || subLabel.toLowerCase() === baseLabel.toLowerCase()) return baseLabel;
      return `${baseLabel} (${subLabel})`;
    }

    function formatEnabledState(value) {
      if (!value) return null;
      const normalized = String(value).toLowerCase();
      return ENABLED_STATUS_LABELS[normalized] || value;
    }

    function formatLatency(latency) {
      if (latency === null || latency === undefined) return '—';
      const numeric = Number(latency);
      if (!Number.isFinite(numeric)) return '—';
      if (numeric >= 1000) return `${Math.round(numeric)} ms`;
      if (numeric >= 100) return `${numeric.toFixed(1)} ms`;
      return `${numeric.toFixed(1).replace(/\.0$/, '')} ms`;
    }

    function formatPacketLoss(value) {
      if (value === null || value === undefined) return '—';
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return '—';
      return `${numeric % 1 === 0 ? numeric : numeric.toFixed(1)}%`;
    }

    function getConnectivitySeverity(item, settings) {
      if (!item) return 'warning';
      if (item.status === 'error') return 'critical';
      if (item.status === 'unknown' && !item.reachable) return 'warning';
      if (item.reachable === false) return 'critical';
      const latency = Number(item.latency_ms);
      const loss = Number(item.packet_loss);
      const warnLatency = Number((settings && settings.latency_warning_ms) !== undefined ? settings.latency_warning_ms : DEFAULT_HEALTH_SETTINGS.latency_warning_ms);
      const criticalLatency = Number((settings && settings.latency_critical_ms) !== undefined ? settings.latency_critical_ms : DEFAULT_HEALTH_SETTINGS.latency_critical_ms);
      const warnLoss = Number((settings && settings.packet_loss_warning) !== undefined ? settings.packet_loss_warning : DEFAULT_HEALTH_SETTINGS.packet_loss_warning);

      if (Number.isFinite(latency)) {
        if (Number.isFinite(criticalLatency) && latency >= criticalLatency) return 'critical';
        if (Number.isFinite(warnLatency) && latency >= warnLatency) return 'warning';
      }
      if (Number.isFinite(loss)) {
        if (loss >= 100) return 'critical';
        if (Number.isFinite(warnLoss) && loss >= warnLoss) return 'warning';
      }
      return 'normal';
    }

    function getConnectivityStatusLabel(item) {
      if (!item) return 'Desconhecido';
      if (item.status === 'error') return 'Erro';
      if (item.reachable === false) return 'Sem resposta';
      if (item.status === 'unknown') return 'Desconhecido';
      return 'Conectado';
    }

    function SummaryMetric({ label, value, percent, status = 'neutral', tooltip }) {
      const severityClass = status === 'neutral' || status === 'normal' ? '' : `is-${status}`;
      const width = percent !== null && percent !== undefined ? `${clampPercent(percent)}%` : null;
      const isArrayValue = Array.isArray(value);
      const hasArrayValues = isArrayValue && value.length > 0;
      const displayValue = isArrayValue
        ? hasArrayValues
          ? value.map((entry, index) => (
              <span key={index} className="metric-value-line">
                {entry}
              </span>
            ))
          : '—'
        : value ?? '—';

      return (
        <div className={`summary-metric ${severityClass}`} title={tooltip || ''}>
          <span className="metric-label">{label}</span>
          <span className={`metric-value${isArrayValue ? ' multiline' : ''}`}>{displayValue}</span>
          {width !== null ? (
            <span className="metric-bar">
              <span className="metric-bar-fill" style={{ width }} />
            </span>
          ) : null}
        </div>
      );
    }

    function ApplianceMetric({ label, value }) {
      const numeric = clampPercent(parseNumberValue(value));
      const status = getSeverityByPercent(numeric);
      const display = value ?? '—';

      return (
        <div
          className={`appliance-metric-pill ${
            status === 'neutral' || status === 'normal' ? '' : `is-${status}`
          }`}
        >
          <span className="pill-label">{label}</span>
          <span className="pill-value">{display}</span>
          {numeric !== null ? (
            <span className="pill-bar">
              <span className="pill-bar-fill" style={{ width: `${numeric}%` }} />
            </span>
          ) : null}
        </div>
      );
    }

    function ApplianceCard({ name, metrics, isConsole }) {
      const usageStatus = getUsageStatus(metrics);
      const badgeLabel = STATUS_LABEL[usageStatus] || 'OK';

      return (
        <div className={`appliance-card status-${usageStatus}`}>
          <div className="appliance-card-header">
            <div className="appliance-card-title">
              <span className="status-icon">{STATUS_ICON[usageStatus]}</span>
              <span className="appliance-label">{name}</span>
              {isConsole ? <span className="appliance-tag">Console</span> : null}
            </div>
            <span className={`status-badge is-${usageStatus}`}>{badgeLabel}</span>
          </div>
          <div className="appliance-metric-grid">
            <ApplianceMetric label="CPU" value={metrics.cpu} />
            <ApplianceMetric label="Mem" value={metrics.memory} />
            <ApplianceMetric label="Storage" value={metrics.storage} />
          </div>
        </div>
      );
    }

    function EnvironmentCard({ environment, isOpen, onToggle }) {
      const licenseExpRawList = Array.isArray(environment.license_exp_list)
        ? environment.license_exp_list.filter(Boolean)
        : [];
      const licenseBreakdown = Array.isArray(environment.license_breakdown)
        ? environment.license_breakdown
        : [];
      const expirationTooltip = licenseBreakdown.length
        ? licenseBreakdown
            .map(item => {
              const kind = item.kind ?? '—';
              const limit = item.limit ?? '—';
              const expLabel = formatExpirationDisplay(item.expires) ?? item.expires;
              const exp = expLabel ? ` (exp: ${expLabel})` : '';
              return `${kind}: ${limit}${exp}`;
            })
            .join('\n')
        : '';
      const expirationCandidatesRaw = licenseExpRawList.length
        ? licenseExpRawList
        : environment.license_exp
        ? [environment.license_exp]
        : [];
      const expirationDisplayList = expirationCandidatesRaw.map(item => formatExpirationDisplay(item) ?? item);
      const expirationDates = expirationCandidatesRaw
        .map(parseDateValue)
        .filter(date => date instanceof Date && !Number.isNaN(date.getTime()));
      const expirationStatus = getExpirationStatus(expirationDates);
      const epsCurrent = parseNumberValue(environment.eps_current);
      const epsMax = parseNumberValue(environment.eps_max);
      const licenseEps = parseNumberValue(environment.license_eps);
      const epsPercent =
        licenseEps !== null && licenseEps > 0 && epsCurrent !== null
          ? (epsCurrent / licenseEps) * 100
          : null;
      const epsMaxPercent =
        licenseEps !== null && licenseEps > 0 && epsMax !== null
          ? (epsMax / licenseEps) * 100
          : null;
      const epsStatus = getEpsStatus(epsCurrent, licenseEps, epsPercent ?? null);
      const epsMaxStatus = getEpsStatus(epsMax, licenseEps, epsMaxPercent ?? null);
      const epsCurrentDisplay = formatCompact(environment.eps_current);
      const epsMaxDisplay = formatCompact(environment.eps_max);
      const licenseEpsDisplay = formatCompact(environment.license_eps);
      const epsSummaryDisplay =
        epsCurrentDisplay !== '—' && licenseEpsDisplay !== '—'
          ? `${epsCurrentDisplay} / ${licenseEpsDisplay}`
          : environment.eps_current ?? '—';

      const consoleMetrics = {
        cpu: environment.cpu,
        memory: environment.memory,
        storage: environment.storage
      };

    function LogSourcesCheckItem({ check, environmentName }) {
      const severity = getSimpleCheckSeverity(check);
      const statusLabel = getSimpleCheckStatusLabel(check);
      const message = check && check.message ? check.message : '';
      const errorMessage = check && check.error ? check.error : '';
      const details = Array.isArray(check && check.details) ? check.details.filter(Boolean) : [];
      const items = Array.isArray(check && check.items) ? check.items : [];
      const total = check && typeof check.total === 'number' ? check.total : null;
      const count = check && typeof check.count === 'number' ? check.count : null;
      const ratio = check && typeof check.ratio === 'number' ? check.ratio : null;
      const percentLabel = ratio !== null ? `${Math.round(ratio * 100)}%` : null;
      const logSourceTypes = Array.isArray(check && check.log_source_types)
        ? check.log_source_types.filter(Boolean)
        : Array.isArray(check && check.protocol_types)
        ? check.protocol_types.filter(Boolean)
        : [];
      const showError = errorMessage && severity === 'critical' && errorMessage !== message;
      const downloadDisabled = !items.length;

      const handleDownload = useCallback(() => {
        if (!items.length) return;
        const headers = [
          'ID',
          'Nome',
          'Status',
          'Motivo',
          'Tipo',
          'Habilitado',
          'Último evento',
        ];
        const lines = items.map(item => {
          const enabledLabel = item && item.enabled ? 'Sim' : 'Não';
          const lastEvent = item && item.last_event_time_label ? item.last_event_time_label : 'Nunca';
          const raw = [
            item && item.id ? String(item.id) : '',
            item && item.name ? String(item.name) : '',
            item && item.status ? String(item.status) : '',
            item && item.reason ? String(item.reason) : '',
            item && item.protocol_type ? String(item.protocol_type) : '',
            enabledLabel,
            lastEvent,
          ];
          return raw.map(value => {
            if (value === null || value === undefined) return '';
            const normalized = String(value).replace(/"/g, '""');
            return /[";,\n]/.test(normalized) ? `"${normalized}"` : normalized;
          }).join(';');
        });

        const csvContent = [headers.join(';'), ...lines].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const baseName = environmentName
          ? environmentName.toLowerCase().replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '')
          : 'ambiente';
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const link = document.createElement('a');
        link.href = url;
        link.download = `log_sources_${baseName}_${timestamp}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, [items, environmentName]);

      return (
        <div className={`health-item log-sources-item is-${severity}`}>
          <div className="health-item-header">
            <span className="health-item-name">Log sources</span>
            <span className={`status-pill is-${severity}`}>{statusLabel}</span>
          </div>
          {message ? <div className="health-item-description">{message}</div> : null}
          <div className="health-item-meta">
            <span>Total avaliados: {total !== null ? total : '—'}</span>
            <span>Em alerta: {count !== null ? count : '—'}</span>
            {percentLabel ? <span>Percentual: {percentLabel}</span> : null}
          </div>
          {details.length ? (
            <div className="health-item-meta">
              {details.map((detail, idx) => (
                <span key={`log-source-detail-${idx}`}>{detail}</span>
              ))}
            </div>
          ) : null}
          {logSourceTypes.length ? (
            <div className="health-item-tags">
              <span className="health-item-tags-label">Tecnologias identificadas</span>
              <ul className="health-tag-list">
                {logSourceTypes.map((label, idx) => (
                  <li key={`log-source-type-${idx}`} className="health-tag">{label}</li>
                ))}
              </ul>
            </div>
          ) : null}
          {showError ? <div className="health-item-error">{errorMessage}</div> : null}
          <div className="health-item-actions">
            <button
              type="button"
              className="btn secondary download-button"
              onClick={handleDownload}
              disabled={downloadDisabled}
            >
              Exportar CSV
            </button>
          </div>
        </div>
      );
    }

    function HealthEnvironmentCard({ environment, settings, isOpen, onToggle }) {
      const detailsRef = useRef(null);
      const [detailsHeight, setDetailsHeight] = useState(0);

      useEffect(() => {
        const el = detailsRef.current;
        if (!el) {
          setDetailsHeight(0);
          return;
        }
        if (!isOpen) {
          setDetailsHeight(0);
          return;
        }
        setDetailsHeight(el.scrollHeight + 24);
      }, [isOpen, environment]);

      const services = Array.isArray(environment && environment.services) ? environment.services : [];
      const connectivity = Array.isArray(environment && environment.connectivity) ? environment.connectivity : [];
      const offenseCheck = environment && environment.offense_check ? environment.offense_check : null;
      const logSourcesCheck = environment && environment.log_sources_check ? environment.log_sources_check : null;
      const errorMessages = Array.isArray(environment && environment.errors)
        ? environment.errors.filter(Boolean)
        : [];

      const serviceSeverities = services.map(getServiceSeverity);
      const connectivitySeverities = connectivity.map(item => getConnectivitySeverity(item, settings));
      let maxLatency = null;
      connectivity.forEach(item => {
        const latency = Number(item && item.latency_ms);
        if (Number.isFinite(latency)) {
          if (maxLatency === null || latency > maxLatency) {
            maxLatency = latency;
          }
        }
      });
      const warnLatency = Number((settings && settings.latency_warning_ms) !== undefined
        ? settings && settings.latency_warning_ms
        : DEFAULT_HEALTH_SETTINGS.latency_warning_ms);
      const criticalLatency = Number((settings && settings.latency_critical_ms) !== undefined
        ? settings && settings.latency_critical_ms
        : DEFAULT_HEALTH_SETTINGS.latency_critical_ms);
      let latencyStatus = 'normal';
      if (maxLatency !== null) {
        if (Number.isFinite(criticalLatency) && maxLatency >= criticalLatency) {
          latencyStatus = 'critical';
        } else if (Number.isFinite(warnLatency) && maxLatency >= warnLatency) {
          latencyStatus = 'warning';
        }
      }
      const coreStatusesForOverall = [...serviceSeverities, ...connectivitySeverities];
      coreStatusesForOverall.push(latencyStatus);
      if (offenseCheck) {
        coreStatusesForOverall.push(getSimpleCheckSeverity(offenseCheck));
      }
      if (errorMessages.length) {
        coreStatusesForOverall.push('critical');
      }

      let overallStatus = combineStatuses(coreStatusesForOverall);

      const hasNonNormalCore = coreStatusesForOverall.some(
        status => status && status in STATUS_RANK && STATUS_RANK[status] > STATUS_RANK.normal
      );

      const totalServices = services.length;
      const serviceCritical = serviceSeverities.filter(status => status === 'critical').length;
      const serviceWarning = serviceSeverities.filter(status => status === 'warning').length;
      const serviceHealthy = totalServices - serviceCritical - serviceWarning;
      const serviceSummaryStatus = serviceCritical > 0 ? 'critical' : serviceWarning > 0 ? 'warning' : 'normal';
      const serviceSummaryValue = totalServices ? `${serviceHealthy}/${totalServices} OK` : 'Sem serviços';

      const totalLinks = connectivity.length;
      const linkCritical = connectivitySeverities.filter(status => status === 'critical').length;
      const linkWarning = connectivitySeverities.filter(status => status === 'warning').length;
      const linkHealthy = totalLinks - linkCritical - linkWarning;
      const linkSummaryStatus = linkCritical > 0 ? 'critical' : linkWarning > 0 ? 'warning' : 'normal';
      const linkSummaryValue = totalLinks ? `${linkHealthy}/${totalLinks} estáveis` : 'Sem links';

      const offenseCount = offenseCheck && typeof offenseCheck.count === 'number' ? offenseCheck.count : null;
      const offenseSummaryValue = offenseCount !== null
        ? `${offenseCount} ${offenseCount === 1 ? 'ofensa' : 'ofensas'}`
        : '—';
      const offenseSeverity = offenseCheck ? getSimpleCheckSeverity(offenseCheck) : 'warning';

      const logSourceTotal = logSourcesCheck && typeof logSourcesCheck.total === 'number' ? logSourcesCheck.total : null;
      const logSourceProblematic = logSourcesCheck && typeof logSourcesCheck.count === 'number' ? logSourcesCheck.count : null;
      const logSourceHealthy = logSourcesCheck && typeof logSourcesCheck.healthy === 'number'
        ? logSourcesCheck.healthy
        : (logSourceTotal !== null && logSourceProblematic !== null
          ? Math.max(logSourceTotal - logSourceProblematic, 0)
          : null);
      const logSourceRatio = logSourcesCheck && typeof logSourcesCheck.ratio === 'number' ? logSourcesCheck.ratio : null;
      const logSourceSummaryValue =
        logSourceTotal !== null && logSourceHealthy !== null
          ? `${logSourceHealthy}/${logSourceTotal}`
          : '—';
      const logSourcePercent = logSourceRatio !== null ? Math.round(logSourceRatio * 100) : null;
      const logSourceSeverity = logSourcesCheck ? getSimpleCheckSeverity(logSourcesCheck) : 'normal';
      if (!hasNonNormalCore && logSourcesCheck && logSourceSeverity in STATUS_RANK) {
        if (STATUS_RANK[logSourceSeverity] > STATUS_RANK.normal) {
          overallStatus = 'normal';
        }
      }

      const summaryMetrics = [
        {
          key: 'services',
          label: 'Serviços',
          value: serviceSummaryValue,
          percent: null,
          status: serviceSummaryStatus,
          tooltip: `${serviceHealthy} de ${totalServices} com status estável`,
        },
        {
          key: 'links',
          label: 'Conectividade',
          value: linkSummaryValue,
          percent: null,
          status: linkSummaryStatus,
          tooltip: `${linkHealthy} de ${totalLinks} destinos respondendo dentro do esperado`,
        },
        {
          key: 'latency',
          label: 'Maior latência',
          value: maxLatency !== null ? formatLatency(maxLatency) : '—',
          percent: null,
          status: latencyStatus,
          tooltip: maxLatency !== null ? `Latência máxima observada: ${formatLatency(maxLatency)}` : undefined,
        },
      ];

      if (offenseCheck) {
        summaryMetrics.push({
          key: 'offenses',
          label: 'Ofensas (24h)',
          value: offenseSummaryValue,
          percent: null,
          status: offenseSeverity,
          tooltip: offenseCheck.message || undefined,
        });
      }

      if (logSourcesCheck) {
        summaryMetrics.push({
          key: 'log-sources',
          label: 'Log sources',
          value: logSourceSummaryValue,
          percent: logSourcePercent,
          status: logSourceSeverity,
          tooltip: logSourcesCheck.message || undefined,
        });
      }

      return (
        <div className={`env-card health-card status-${overallStatus} ${isOpen ? 'open' : ''}`}>
          <button
            type="button"
            className="env-card-header"
            onClick={onToggle}
            aria-expanded={isOpen}
          >
            <div className="env-header-main">

          const targetSiem = typeof siemOverride === 'string' ? siemOverride : selectedSiemRef.current;
          const query = targetSiem ? `?siem=${encodeURIComponent(targetSiem)}` : '';
          const response = await fetch(`/api/monitor${query}`);
          if (!response.ok) {
            throw new Error('Não foi possível carregar os dados do monitoramento.');
          }
          const payload = await response.json();
          const available = Array.isArray(payload.available_siems) ? payload.available_siems : [];
          setAvailableSiems(available);
          const resolvedSiem = payload.selected_siem || targetSiem || (available[0] || '');

            .slice()
            .sort((a, b) => {
              const aStatus = getEnvironmentOverallStatus(a);

              const aRank = STATUS_RANK[aStatus] ?? 0;
              const bRank = STATUS_RANK[bStatus] ?? 0;
              if (aRank !== bRank) {
                return bRank - aRank;
              }
              const aName = a && a.name ? String(a.name) : '';
              const bName = b && b.name ? String(b.name) : '';

    const CONNECTOR_STATUS_LABEL = {
      active: 'Ativos',
      error: 'Com erro',
      paused: 'Pausados',
      pending: 'Pendentes',
      other: 'Outros',
    };

    function formatDateTime(value) {
      if (!value) return '—';
      const parsed = parseDateValue(value);
      if (!parsed) return value;
      return parsed.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function normalizeConnectorStatus(value) {
      const text = (value || '').toString().toLowerCase();
      if (!text) return 'other';
      if (text === 'active' || text === 'ok' || text === 'enabled') return 'active';
      if (text === 'error' || text === 'failed' || text === 'critical') return 'error';
      if (text === 'paused' || text === 'stopped' || text === 'suspended') return 'paused';
      if (text === 'pending' || text === 'new' || text === 'waiting') return 'pending';
      return text;
    }

    function formatVolume(entry) {
      if (!entry) return '—';
      if (entry.last_ingested_volume_one_day) return entry.last_ingested_volume_one_day;
      if (typeof entry.last_ingested_volume_bytes === 'number') {
        const gb = entry.last_ingested_volume_bytes / (1024 ** 3);
        return `${gb.toFixed(2)} GB`;
      }
      return formatConnectorVolume(entry);
    }

    function formatIngestionMetric(value, unit) {
      if (value === null || value === undefined) return '—';
      const safeUnit = unit || 'GB';
      const decimals = safeUnit.toUpperCase() === 'EPS' ? 0 : 2;
      return `${Number(value).toFixed(decimals)} ${safeUnit}`;
    }

        setReport(null);
        try {
          const resp = await fetch('/api/reports', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              environment_id: Number(selectedEnv),
              start_date: startDate,
              end_date: endDate,
            }),
          });
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload && payload.detail ? payload.detail : 'Falha ao gerar relatório.');
          }
          const reportPayload = payload && payload.report ? payload.report : null;
          if (!reportPayload) throw new Error('Resposta do relatório vazia.');
          setReport(reportPayload);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Erro ao gerar relatório.');
        } finally {
          setLoading(false);
        }
      }, [selectedEnv, startDate, endDate]);

      const envLabel = useMemo(() => {
        if (!report || !report.environment) return '';
        const pieces = [];
        if (report.environment.name) pieces.push(report.environment.name);
        if (report.environment.code) pieces.push(`(${report.environment.code})`);
        if (report.environment.siem) pieces.push(`• ${report.environment.siem}`);
        return pieces.join(' ');
      }, [report]);

      const summaryStatus = useMemo(() => normalizeStatus(report && report.status), [report]);
      const connectorResult = useMemo(
        () => (report?.results || []).find((item) => (item.type || '').toLowerCase() === 'connectors'),
        [report]
      );
      const connectorsList = useMemo(
        () => (connectorResult && Array.isArray(connectorResult.extra?.connectors) ? connectorResult.extra.connectors : []),
        [connectorResult]
      );
      const connectorBreakdown = useMemo(
        () => (connectorResult && connectorResult.extra && connectorResult.extra.status_breakdown ? connectorResult.extra.status_breakdown : {}),
        [connectorResult]
      );
      const connectorsTotal = connectorResult && connectorResult.count !== undefined && connectorResult.count !== null
        ? connectorResult.count
        : connectorsList.length;
      const lastIngestion = connectorResult && connectorResult.extra ? connectorResult.extra.latest_last_ingested_at : null;
      const ingestionValue = connectorResult && connectorResult.extra ? connectorResult.extra.ingestion_value : null;
      const ingestionUnit = connectorResult && connectorResult.extra ? connectorResult.extra.ingestion_unit : null;
      const ingestionWarning = connectorResult && connectorResult.status === 'warning' ? connectorResult.message : '';
      const connectorStatusCards = useMemo(() => {
        const order = ['active', 'error', 'paused', 'pending'];
        const cards = order.map((key) => ({
          key,
          label: CONNECTOR_STATUS_LABEL[key],
          value: connectorBreakdown[key] || 0,
        }));
        const accounted = cards.reduce((sum, item) => sum + item.value, 0);
        const others = connectorsTotal - accounted;
        if (others > 0) {
          cards.push({ key: 'other', label: CONNECTOR_STATUS_LABEL.other, value: others });
        }
        return cards;
      }, [connectorBreakdown, connectorsTotal]);
      const operationalResults = useMemo(
        () => (report?.results || []).filter((item) => (item.type || '').toLowerCase() !== 'connectors'),
        [report]
      );

      return (
        <div className="monitor-app reports-app">
          <div className="meta-row">
            <div className="meta-left">
              <div className="meta-description">
                <span className="meta-title">Reports</span>
                <span className="meta-subtitle">Selecione o ambiente e o período da coleta.</span>
              </div>
            </div>
            {report && report.total !== undefined ? (
              <div className="meta-right report-summary-pill">
                <span className="metric-label">Total</span>
                <span className="metric-value">{report.total}</span>
              </div>
            ) : null}
          </div>

          <form className="card-panel report-form form-grid" onSubmit={handleSubmit}>
            <div className="form-field">
              <label htmlFor="report-env">Ambiente</label>
              <select
                id="report-env"
                value={selectedEnv}
                onChange={(e) => setSelectedEnv(e.target.value)}
                disabled={loading || envOptions.length === 0}
                required
              >
                {envOptions.length === 0 ? (
                  <option value="">Nenhum ambiente configurado</option>
                ) : (
                  envOptions.map((env) => (
                    <option key={env.id} value={env.id}>
                      {env.name} {env.code ? `(${env.code})` : ''} — {env.siem || 'QRadar'}
                    </option>
                  ))
                )}
              </select>
            </div>
            <div className="form-field">
              <label htmlFor="report-start">Data inicial</label>
              <input
                id="report-start"
                type="date"
                value={startDate}
                onChange={(e) => setStartDate(e.target.value)}
                max={endDate}
                required
              />
            </div>
            <div className="form-field">
              <label htmlFor="report-end">Data final</label>
              <input
                id="report-end"
                type="date"
                value={endDate}
                onChange={(e) => setEndDate(e.target.value)}
                min={startDate}
                required
              />
            </div>
            <div className="form-field form-field--full">
              <button className={`btn${loading ? ' is-loading' : ''}`} type="submit" disabled={loading || envOptions.length === 0}>
                {loading ? 'Consultando…' : 'Consultar'}
              </button>
            </div>
          </form>

          {error ? <div className="error-message">{error}</div> : null}

          {!report && !error ? (
            <div className="empty-state">Selecione o ambiente e o período e clique em Consultar.</div>
          ) : null}

          {report ? (
            <div className="report-results">
              <div className="report-summary card-panel executive-card">
                <div className="report-summary-header">
                  <div>
                    <div className="report-env">{envLabel || 'Ambiente selecionado'}</div>
                    <div className="report-period">Período: {formatDateInputLabel(startDate)} a {formatDateInputLabel(endDate)}</div>
                  </div>
                  <span className={`status-pill ${summaryStatus === 'critical' ? 'is-critical' : summaryStatus === 'warning' ? 'is-warning' : ''}`}>
                    {STATUS_ICON[summaryStatus] || STATUS_ICON.normal} {STATUS_LABEL[summaryStatus] || 'OK'}
                  </span>
                </div>
                <div className="executive-metrics">
                  <div className="metric-tile">
                    <span className="metric-label">Total de ocorrências</span>
                    <span className="metric-value">{report.total}</span>
                  </div>
                  <div className="metric-tile">
                    <span className="metric-label">Conectores</span>
                    <span className="metric-value">{connectorsTotal || 0}</span>
                    <span className="metric-hint">Panorama geral do ambiente</span>
                  </div>
                  <div className="metric-tile">
                    <span className="metric-label">Última ingestão</span>
                    <span className="metric-value">{formatDateTime(lastIngestion)}</span>
                    <span className="metric-hint">Atualizado via API</span>
                  </div>
                  <div className="metric-tile">
                    <span className="metric-label">Ingestão 24h (GB)</span>
                    <span className="metric-value">{formatIngestionMetric(ingestionValue, ingestionUnit)}</span>
                    <span className="metric-hint">Volume somado dos conectores</span>
                  </div>
                </div>
              </div>

              <div className="report-grid">
                <div className="card-panel insights-panel">
                  <div className="panel-heading">
                    <div>
                      <p className="eyebrow">Visão executiva</p>
                      <h3>Resumo do período</h3>
                    </div>
                  </div>
                  <div className="report-cards report-cards--insights">
                    {operationalResults.map((item, idx) => {
                      const status = normalizeStatus(item.status || 'warning');
                      const pillClass = status === 'critical' ? 'status-pill is-critical' : status === 'warning' ? 'status-pill is-warning' : 'status-pill';
                      const statusIcon = STATUS_ICON[status] || STATUS_ICON.normal;
                      const statusLabel = STATUS_LABEL[status] || 'OK';
                      return (
                        <div className="report-card card-panel" key={`${item.type || 'item'}-${idx}`}>
                          <div className="report-card-header">
                            <div>
                              <div className="report-card-title">{item.label || 'Métrica'}</div>
                              <div className="report-card-subtitle">{item.message || '—'}</div>
                            </div>
                            <span className={pillClass}>{statusIcon} {statusLabel}</span>
                          </div>
                          <div className="report-card-body">
                            <div className="report-metric">
                              <span className="report-metric-label">Quantidade</span>
                              <span className="report-metric-value">{item.count !== null && item.count !== undefined ? item.count : '—'}</span>
                            </div>
                            {item.details && item.details.length ? (
                              <ul className="report-details">
                                {item.details.map((detail, i) => <li key={`detail-${idx}-${i}`}>{detail}</li>)}
                              </ul>
                            ) : null}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="card-panel connectors-panel">
                  <div className="panel-heading">
                    <div>
                      <p className="eyebrow">Conectores</p>
                      <h3>Estado operacional</h3>
                    </div>
                  </div>
                  {ingestionWarning ? (
                    <div className="warning-message">{ingestionWarning}</div>
                  ) : null}
                  <div className="connector-status-list">
                    {connectorStatusCards.map((card) => (
                      <div className="connector-status-row" key={card.key}>
                        <span className="connector-status-label">{card.label}</span>
                        <span className="connector-status-value">{card.value}</span>
                      </div>
                    ))}
                  </div>
                  <div className="table-wrapper connectors-table">
                    <table className="data-table">
                      <thead>
                        <tr>
                          <th>Conector</th>
                          <th>Status</th>
                          <th>Última ingestão</th>
                          <th>Volume (24h)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {connectorsList.length === 0 ? (
                          <tr>
                            <td colSpan={4} className="muted">Nenhum conector retornado pela API.</td>
                          </tr>
                        ) : (
                          connectorsList.map((connector, idx) => {
                            const status = normalizeConnectorStatus(connector.status);
                            const pillClass = status === 'error'
                              ? 'status-pill is-critical'
                              : status === 'paused'
                              ? 'status-pill is-warning'
                              : status === 'pending'
                              ? 'status-pill is-warning'
                              : 'status-pill';
                            return (
                              <tr key={`${connector.id || 'connector'}-${idx}`}>
                                <td>
                                  <div className="connector-name">{connector.name || 'Conector'}</div>
                                  <div className="connector-meta">{connector.vendor || connector.product || '—'}</div>
                                </td>
                                <td>
                                  <span className={pillClass}>{connector.status_raw || connector.status || '—'}</span>
                                </td>
                                <td>{formatDateTime(connector.last_ingested_at)}</td>
                                <td>{formatVolume(connector)}</td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          ) : null}
        </div>
      );
    }

    function DashboardApp() {
      const [activeTab, setActiveTab] = useState('monitor');

      useEffect(() => {
        const titleEl = document.getElementById('dashboard-title');
        if (titleEl) {
          if (activeTab === 'monitor') {
            titleEl.textContent = 'Monitoramento';
          } else if (activeTab === 'health') {
            titleEl.textContent = 'Health Check';
          } else if (activeTab === 'reports') {
            titleEl.textContent = 'Reports';
          } else {
            titleEl.textContent = 'Jira';
          }
        }
      }, [activeTab]);

      useEffect(() => {
        const subtitleEl = document.getElementById('dashboard-subtitle');
        if (!subtitleEl) return;
        subtitleEl.textContent = activeTab === 'monitor'
          ? 'Carregando status do monitoramento…'
          : activeTab === 'health'
          ? 'Carregando status do health check…'
          : activeTab === 'reports'
          ? 'Carregando reports…'
          : 'Carregando dados do Jira…';
      }, [activeTab]);

      useEffect(() => {
        const tabsRoot = document.getElementById('module-tabs');
        if (!tabsRoot) return;
        const buttons = Array.from(tabsRoot.querySelectorAll('[data-tab]'));
        const handlers = [];
        buttons.forEach(button => {
          const tab = button.getAttribute('data-tab');
          if (!tab) return;
          const handler = () => {
            setActiveTab(tab);
          };
          button.addEventListener('click', handler);
          handlers.push({ button, handler });
        });
        return () => {
          handlers.forEach(({ button, handler }) => {
            button.removeEventListener('click', handler);
          });
        };
      }, []);

      useEffect(() => {
        const tabsRoot = document.getElementById('module-tabs');
        if (!tabsRoot) return;
        const buttons = Array.from(tabsRoot.querySelectorAll('[data-tab]'));
        buttons.forEach(button => {
          const tab = button.getAttribute('data-tab');
          const isActive = tab === activeTab;
          if (isActive) {
            button.classList.add('is-active');
            button.setAttribute('aria-selected', 'true');
            button.removeAttribute('tabindex');
          } else {
            button.classList.remove('is-active');
            button.setAttribute('aria-selected', 'false');
            button.setAttribute('tabindex', '-1');
          }
        });
      }, [activeTab]);

      return (
        <div className="dashboard-panels">
          {activeTab === 'monitor'
            ? <MonitorApp key="monitor" />
            : activeTab === 'health'
            ? <HealthCheckApp key="health" />
            : activeTab === 'reports'
            ? <ReportsApp key="reports" />
            : <JiraApp key="jira" />}
        </div>
      );
    }

    const rootEl = document.getElementById('monitor-app-root');
    if (rootEl) {
      const root = ReactDOM.createRoot(rootEl);
      root.render(<DashboardApp />);
    }
    {% endraw %}
  </script>
</body>
</html>
