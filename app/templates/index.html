<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRadar Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/static/logo-asper.png" alt="ASPER">
        <div class="title">
          <h1>Monitoramento &amp; Execução</h1>
          <div class="sub">QRadar • Zabbix • SSH</div>
        </div>
      </div>
      <div class="row">
        <span class="small">Logado como {{user}}</span>
        <a class="btn secondary" href="/me/password">Minha conta</a>
        {% if is_admin %}
        <a class="btn secondary" href="/admin/users">Admin</a>
        {% endif %}
        <a class="btn secondary" href="/logout">Sair</a>
      </div>
    </header>

    <div class="tabs-mode">
      <div class="tab active" data-mode="monitor">Monitoramento</div>
      <div class="tab" data-mode="scripts">Execução de Scripts</div>
    </div>

    <section id="mode-monitor" class="card">
      <div id="monitor-app-root"></div>
    </section>

    <section id="mode-scripts" class="card" style="display:none">
      <div class="empty-state">Selecione um script ao lado para executar.</div>
    </section>
  </div>

  <script>
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const sections = {
      monitor: document.getElementById('mode-monitor'),
      scripts: document.getElementById('mode-scripts')
    };
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.entries(sections).forEach(([mode, el]) => {
          if (!el) return;
          el.style.display = mode === tab.dataset.mode ? 'block' : 'none';
        });
      });
    });
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    {% raw %}
    const { useState, useEffect, useCallback, useRef } = React;

    const DAY_MS = 24 * 60 * 60 * 1000;
    const STATUS_ICON = {
      normal: '🟢',
      warning: '🟡',
      critical: '🔴'
    };

    function parseNumberValue(raw) {
      if (raw === null || raw === undefined) return null;
      const trimmed = String(raw).trim();
      if (!trimmed) return null;

      const tokenMatches = trimmed.replace(/\u00A0/g, ' ').match(/[-+]?\d[\d.,\s]*/g);
      if (!tokenMatches) return null;

      for (const token of tokenMatches) {
        let sanitized = token
          .replace(/\s+/g, '')
          .replace(/[^0-9,.+-]/g, '');
        if (!sanitized || /^[-+]+$/.test(sanitized)) continue;

        const isNegative = sanitized.startsWith('-');
        const isPositive = sanitized.startsWith('+');
        if (isNegative || isPositive) {
          sanitized = sanitized.slice(1);
        }

        const hasComma = sanitized.includes(',');
        const hasDot = sanitized.includes('.');

        if (hasComma && hasDot) {
          if (sanitized.lastIndexOf('.') > sanitized.lastIndexOf(',')) {
            sanitized = sanitized.replace(/,/g, '');
          } else {
            sanitized = sanitized.replace(/\./g, '').replace(',', '.');
          }
        } else if (hasComma) {
          const thousandsCommaPattern = /^\d{1,3}(,\d{3})+$/;
          if (thousandsCommaPattern.test(sanitized)) {
            sanitized = sanitized.replace(/,/g, '');
          } else {
            sanitized = sanitized.replace(/,/g, '.');
          }
        } else if (hasDot) {
          const thousandsDotPattern = /^\d{1,3}(\.\d{3})+$/;
          if (thousandsDotPattern.test(sanitized)) {
            sanitized = sanitized.replace(/\./g, '');
          }
        }

        const numeric = Number(sanitized);
        if (Number.isFinite(numeric)) {
          return isNegative ? -numeric : numeric;
        }
      }

      return null;
    }

    function parseDateValue(raw) {
      if (typeof raw !== 'string') return null;
      const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) {
        const [, dd, mm, yyyy] = m;
        const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
        return Number.isNaN(date.getTime()) ? null : date;
      }
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function getUsageStatus({ cpu, memory, storage }) {
      const values = [cpu, memory, storage]
        .map(parseNumberValue)
        .filter(v => typeof v === 'number');
      if (!values.length) return 'normal';
      const max = Math.max(...values);
      if (max >= 85) return 'critical';
      if (max >= 70) return 'warning';
      return 'normal';
    }

    function getExpirationStatus(expirations) {
      if (!expirations.length) return 'normal';
      const now = new Date();
      const soonest = expirations.reduce((min, current) => (current < min ? current : min));
      const diffDays = (soonest - now) / DAY_MS;
      if (diffDays < 15) return 'critical';
      if (diffDays < 30) return 'warning';
      return 'normal';
    }

    function formatCompact(value) {
      const numeric = parseNumberValue(value);
      if (numeric === null) return '—';
      if (numeric >= 1000000) return (numeric / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (numeric >= 1000) return Math.round(numeric / 100) / 10 + 'k';
      return String(numeric);
    }

    function SummaryItem({ label, value, status, tooltip }) {
      const classes = ['summary-item'];
      if (status === 'critical') {
        classes.push('danger');
      } else if (status === 'warning') {
        classes.push('attention');
      }

      return (
        <span className={classes.join(' ')} title={tooltip || ''}>
          <strong>{label}:</strong>
          <span className="value">{value ?? '—'}</span>
        </span>
      );
    }

    function ApplianceRow({ name, metrics, isConsole, branchSymbol }) {
      const usageStatus = getUsageStatus(metrics);
      const statusClass =
        usageStatus === 'critical' ? 'danger' : usageStatus === 'warning' ? 'attention' : '';

      return (
        <div className="appliance-row">
          <span className="appliance-branch" aria-hidden="true">{branchSymbol}</span>
          <div className="appliance-name">
            <span className="status-icon">{STATUS_ICON[usageStatus]}</span>
            <span className="appliance-label">{name}</span>
            {isConsole ? <span className="appliance-tag">Console</span> : null}
          </div>
          <div className={`appliance-metric ${statusClass}`}>
            <strong>CPU</strong>
            <span>{metrics.cpu ?? '—'}</span>
          </div>
          <div className={`appliance-metric ${statusClass}`}>
            <strong>Mem</strong>
            <span>{metrics.memory ?? '—'}</span>
          </div>
          <div className={`appliance-metric ${statusClass}`}>
            <strong>Storage</strong>
            <span>{metrics.storage ?? '—'}</span>
          </div>
        </div>
      );
    }

    function EnvironmentCard({ environment, isOpen, onToggle }) {
      const licenseExpList = Array.isArray(environment.license_exp_list)
        ? environment.license_exp_list.filter(Boolean)
        : [];
      const licenseBreakdown = Array.isArray(environment.license_breakdown)
        ? environment.license_breakdown
        : [];
      const expirationTooltip = licenseBreakdown.length
        ? licenseBreakdown
            .map(item => {
              const kind = item.kind ?? '—';
              const limit = item.limit ?? '—';
              const exp = item.expires ? ` (exp: ${item.expires})` : '';
              return `${kind}: ${limit}${exp}`;
            })
            .join('\n')
        : '';
      const expirationCandidates = licenseExpList.length
        ? licenseExpList
        : environment.license_exp
        ? [environment.license_exp]
        : [];
      const expirationDates = expirationCandidates
        .map(parseDateValue)
        .filter(date => date instanceof Date && !Number.isNaN(date.getTime()));
      const expirationStatus = getExpirationStatus(expirationDates);
      const epsCurrent = parseNumberValue(environment.eps_current);
      const epsMax = parseNumberValue(environment.eps_max);
      const licenseEps = parseNumberValue(environment.license_eps);
      const epsDanger = licenseEps !== null && epsCurrent !== null && epsCurrent > licenseEps;
      const epsMaxDanger = licenseEps !== null && epsMax !== null && epsMax > licenseEps;
      const epsCurrentDisplay = formatCompact(environment.eps_current);
      const epsMaxDisplay = formatCompact(environment.eps_max);
      const licenseEpsDisplay = formatCompact(environment.license_eps);
      const epsSummaryDisplay =
        epsCurrentDisplay !== '—' && licenseEpsDisplay !== '—'
          ? `${epsCurrentDisplay} / ${licenseEpsDisplay}`
          : environment.eps_current ?? '—';

      const consoleMetrics = {
        cpu: environment.cpu,
        memory: environment.memory,
        storage: environment.storage
      };
      const envStatus = getUsageStatus(consoleMetrics);

      const appliances = Array.isArray(environment.appliances) ? environment.appliances : [];

      const detailsRef = useRef(null);
      const [detailsHeight, setDetailsHeight] = useState(0);

      useEffect(() => {
        const el = detailsRef.current;
        if (!el) return;
        if (isOpen) {
          const frame = requestAnimationFrame(() => {
            setDetailsHeight(el.scrollHeight);
          });
          return () => cancelAnimationFrame(frame);
        }
        setDetailsHeight(0);
      }, [isOpen, appliances, environment.cpu, environment.memory, environment.storage]);

      const detailItems = [
        {
          name: 'Console',
          metrics: consoleMetrics,
          isConsole: true
        },
        ...appliances.map(appliance => ({
          name: appliance.name ?? appliance.zabbix_host ?? 'Appliance',
          metrics: {
            cpu: appliance.cpu,
            memory: appliance.memory,
            storage: appliance.storage
          },
          isConsole: false
        }))
      ];

      return (
        <div className={`env-card ${isOpen ? 'open' : ''}`}>
          <div className="env-card-header">
            <div className="env-card-top">
              <div className="env-name">
                <span className="status-icon">{STATUS_ICON[envStatus]}</span>
                {environment.name ?? '—'}
              </div>
              <button
                type="button"
                className="env-toggle"
                onClick={onToggle}
                aria-expanded={isOpen}
              >
                <span>{isOpen ? 'Recolher detalhes' : 'Expandir detalhes'}</span>
                <span className="chevron">▼</span>
              </button>
            </div>
            <div className="env-summary-line">
              <SummaryItem
                label="CPU"
                value={environment.cpu ?? '—'}
                status={getUsageStatus({ cpu: environment.cpu })}
              />
              <SummaryItem
                label="Mem"
                value={environment.memory ?? '—'}
                status={getUsageStatus({ memory: environment.memory })}
              />
              <SummaryItem
                label="Storage"
                value={environment.storage ?? '—'}
                status={getUsageStatus({ storage: environment.storage })}
              />
              <SummaryItem
                label="EPS Atual"
                value={environment.eps_current ?? epsSummaryDisplay}
                status={epsDanger ? 'critical' : 'normal'}
              />
              <SummaryItem
                label="EPS Máx"
                value={environment.eps_max ?? epsMaxDisplay}
                status={epsMaxDanger ? 'critical' : 'normal'}
              />
              <SummaryItem
                label="Licença EPS"
                value={environment.license_eps ?? licenseEpsDisplay}
                status={epsDanger ? 'critical' : 'normal'}
              />
              <SummaryItem
                label="Expiração"
                value={licenseExpList.length ? licenseExpList.join(' • ') : environment.license_exp ?? '—'}
                status={expirationStatus}
                tooltip={expirationTooltip}
              />
            </div>
          </div>
          <div
            className="env-details"
            style={{ maxHeight: `${detailsHeight}px` }}
            aria-hidden={!isOpen}
          >
            <div ref={detailsRef} className="env-details-inner">
              {detailItems.length ? (
                detailItems.map((item, idx) => (
                  <ApplianceRow
                    key={`${environment.name || 'env'}-appliance-${idx}`}
                    name={item.name}
                    metrics={item.metrics}
                    isConsole={item.isConsole}
                    branchSymbol={idx === detailItems.length - 1 ? '└──' : '├──'}
                  />
                ))
              ) : (
                <div className="empty-appliances">Nenhum appliance adicional configurado.</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function MonitorApp() {
      const [rows, setRows] = useState([]);
      const [updatedAt, setUpdatedAt] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [openItems, setOpenItems] = useState(new Set());

      const loadData = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const response = await fetch('/api/monitor');
          if (!response.ok) {
            throw new Error('Não foi possível carregar os dados do monitoramento.');
          }
          const payload = await response.json();
          const environments = Array.isArray(payload.rows) ? payload.rows : [];
          setRows(environments);
          if (payload.updated_at) {
            setUpdatedAt(payload.updated_at);
          } else {
            setUpdatedAt(new Date().toLocaleString());
          }
          setLoading(false);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Erro inesperado ao carregar o monitoramento.');
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        loadData();
        const id = setInterval(loadData, 30000);
        return () => clearInterval(id);
      }, [loadData]);

      const toggleItem = useCallback((key) => {
        setOpenItems(prev => {
          const next = new Set(prev);
          if (next.has(key)) {
            next.delete(key);
          } else {
            next.add(key);
          }
          return next;
        });
      }, []);

      return (
        <div className="monitor-app">
          <div className="meta-row">
            <div className="left">
              <button className="btn secondary" type="button" onClick={loadData} disabled={loading}>
                {loading ? 'Atualizando…' : 'Atualizar'}
              </button>
              {loading ? <span className="small">Buscando dados em tempo real…</span> : null}
            </div>
            <div className="right">
              {updatedAt ? <span className="small">Atualizado: {updatedAt}</span> : null}
            </div>
          </div>
          <div className="row small">
            <span className="badge">CPU/Mem/Storage via Zabbix</span>
            <span className="badge warn">Licença via license.sh</span>
          </div>
          {error ? <div className="error-message">{error}</div> : null}
          {rows.length === 0 && !loading ? (
            <div className="empty-state">Nenhum ambiente configurado ainda.</div>
          ) : null}
          <div className="env-list">
            {rows.map((environment, index) => {
              const key = environment.name || `env-${index}`;
              return (
                <EnvironmentCard
                  key={key}
                  environment={environment}
                  isOpen={openItems.has(key)}
                  onToggle={() => toggleItem(key)}
                />
              );
            })}
          </div>
        </div>
      );
    }

    const rootEl = document.getElementById('monitor-app-root');
    if (rootEl) {
      const root = ReactDOM.createRoot(rootEl);
      root.render(<MonitorApp />);
    }
    {% endraw %}
  </script>
</body>
</html>
