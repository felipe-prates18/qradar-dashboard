<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Minha conta • Trocar senha</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/static/logo-asper.png" alt="ASPER">
      <div class="title">
        <h1>Minha conta</h1>
        <div class="sub">Troca de senha</div>
      </div>
    </div>
    <div class="row">
      <a class="btn secondary" href="/">Voltar</a>
      <a class="btn secondary" href="/logout">Sair</a>
    </div>
  </header>

  {% if error %}<div class="alert error">{{error}}</div>{% endif %}
  {% if success %}<div class="alert ok">{{success}}</div>{% endif %}

  <section class="card">
    <form method="post" action="/me/password" class="col">
      <input type="password" name="current_password" placeholder="Senha atual" required>
      <input type="password" name="new_password" placeholder="Nova senha" required>
      <input type="password" name="confirm_password" placeholder="Confirme a nova senha" required>
      <button class="btn">Alterar senha</button>
    </form>
  </section>
</div>
</body>
</html>
