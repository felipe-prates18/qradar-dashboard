<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta • Trocar senha</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/static/logo-asper.png" alt="ASPER">
        <div class="title">
          <h1>Minha conta</h1>
          <div class="sub">Troca de senha</div>
        </div>
      </div>
      <div class="row">
        <span class="small">Logado como {{ user }}</span>
        <a class="btn secondary" href="/">Dashboard</a>
        <a class="btn secondary" href="/logout">Sair</a>
      </div>
    </header>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert ok">{{ success }}</div>{% endif %}

    <section class="card">
      <form method="post" action="/me/password" class="col">
        <div class="field">
          <label class="field-label" for="current_password">Senha atual</label>
          <div class="field-control">
            <input id="current_password" type="password" name="current_password" placeholder="Digite sua senha atual" autocomplete="current-password" required>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="new_password">Nova senha</label>
          <div class="field-control">
            <input id="new_password" type="password" name="new_password" placeholder="Crie uma nova senha" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="confirm_password">Confirme a nova senha</label>
          <div class="field-control">
            <input id="confirm_password" type="password" name="confirm_password" placeholder="Repita a nova senha" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <button class="btn" type="submit">Alterar senha</button>
      </form>
    </section>
  </div>
</body>
</html>
